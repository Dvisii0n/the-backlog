<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<link rel="stylesheet" href="styles.css" />
		<title>Iniciar Sesion</title>
	</head>
	<body>
		<form class="login">
			<div>
				<label for="nombre">Usuario </label>
				<input
					type="text"
					id="nombre"
					name="nombre"
					class="formInput"
					required
				/>
			</div>

			<div>
				<label for="password">Contraseña</label>
				<input
					type="password"
					id="password"
					name="password"
					class="formInput"
					required
				/>
			</div>
			<button type="button" class="btnLogin">Iniciar Sesion</button>
			<a href="registro.html">Crear cuenta</a>
		</form>
		<ul class="loginErrores"></ul>
	</body>
	<script type="module" src="src/login.js" defer></script>
</html>
